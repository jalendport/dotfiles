- clean: ['~']

- link:
    ~/.dotfiles: .
    ~/.gitignore: gitignore-global
    ~/.hushlogin:
    ~/.zshrc:
    ~/.zprofile:
    ~/.config/ghostty/config:
      path: ghostty/config
      create: true
    ~/.config/starship.toml:
      path: starship/starship.toml
      create: true
    ~/.claude/settings.json:
      path: ai/claude/settings.json
      create: true
    ~/.claude/statusline.sh:
      path: ai/claude/statusline.sh
      create: true
    # Shared global agent instructions — one canonical AGENTS.md linked into each tool
    ~/.claude/CLAUDE.md:
      path: ai/AGENTS.md
      create: true
    ~/.codex/AGENTS.md:
      path: ai/AGENTS.md
      create: true
    ~/.codex/hooks.json:
      path: ai/codex/hooks.json
      force: true
    ~/.gemini/antigravity-cli/AGENTS.md:
      path: ai/AGENTS.md
      create: true
    ~/.grok/AGENTS.md:
      path: ai/AGENTS.md
      create: true
    ~/.grok/statusline.sh:
      path: ai/grok/statusline.sh
      create: true
    ~/.grok/hooks/commit-skill.json:
      path: ai/grok/hooks/commit-skill.json
      create: true

- shell:
  - command: git config --global core.excludesfile ~/.gitignore
    description: Configure git to use the global gitignore
  - command: git config core.hooksPath .githooks
    description: Re-run dotbot after pulls via repo-tracked git hooks
  - command: python3 ai/bin/toml-upsert.py ~/.codex/config.toml ai/codex/config.toml
    description: Configure Codex status line and memory
  - command: python3 ai/bin/toml-upsert.py ~/.grok/config.toml ai/grok/config.toml
    description: Configure Grok compatibility, memory, status line, and Solo MCP
  - command: bash ai/agy/apply-hooks.sh
    description: Configure agy commit skill hook
  - command: |
      src="$PWD/ai/skills"
      for dir in "$HOME/.claude/skills" "$HOME/.codex/skills" "$HOME/.gemini/antigravity-cli/skills" "$HOME/.agents/skills"; do
        # the mirror itself may be a legacy whole-directory symlink; replace with a real dir
        [ -L "$dir" ] && rm -f "$dir"
        mkdir -p "$dir" || continue
        # prune dangling skill symlinks (e.g. a skill deleted from the repo)
        ls -1 "$dir" 2>/dev/null | while IFS= read -r name; do
          link="$dir/$name"
          [ -L "$link" ] && [ ! -e "$link" ] && rm -f "$link"
        done
        # link every skill (any dir with a SKILL.md, flat or one category level deep),
        # preserving each tool's built-ins
        find "$src" -mindepth 2 -maxdepth 3 -name SKILL.md 2>/dev/null | while IFS= read -r file; do
          skill="$(dirname "$file")"
          target="$dir/$(basename "$skill")"
          # a real dir here would swallow the symlink (ln -sfn puts it inside); the repo wins
          [ -e "$target" ] && [ ! -L "$target" ] && rm -rf "$target"
          ln -sfn "$skill" "$target"
        done
      done
      true
    description: Link shared skills into Claude, Codex, agy (Antigravity), and Grok (~/.agents/skills)
