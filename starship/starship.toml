# Starship prompt config.
# Colors are 256-color palette indices (fg:NN). Known engine limitations:
#   - No instant prompt; the prompt renders synchronously each time.
#   - Git status is computed per prompt (see command_timeout below), so very
#     large repos can lag briefly.

"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt.
add_newline = true

# Give git status room to compute on big repos instead of blanking.
command_timeout = 1000

# Two-line layout: frame + dir + git on the left, a right-aligned status stack
# pushed out with a dotted fill, and the prompt char on the second line.
format = """
[╭─](fg:238)$username$hostname$directory${custom.worktree}$git_branch$git_commit$git_status$git_state$fill$status$cmd_duration$jobs$direnv${custom.spark}$time
[╰─](fg:238)$character """

# Dotted separator filling the gap between the left and right segments.
[fill]
symbol = '·'
style = 'fg:238'

# Prompt char: green ❯ on success, red ❯ on error; ❮ in vi command mode.
[character]
success_symbol = '[❯](fg:76)'
error_symbol = '[❯](fg:196)'
vimcmd_symbol = '[❮](fg:76)'

# user@host: hidden locally, shown when SSH'd in (or as root).
[username]
style_user = 'fg:180'
style_root = 'fg:196'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'fg:180'
format = '[@$hostname]($style) '

# Directory: teal, full path with no truncation.
[directory]
style = 'fg:31'
home_symbol = '~'
truncation_length = 0
truncate_to_repo = false
read_only = ' '
read_only_style = 'fg:31'

# Linked-worktree marker: dim ⊕ before the branch when cwd is inside a git
# worktree (a .git *file* whose gitdir points into .git/worktrees/ — the
# gitdir check keeps submodules, which also use .git files, from matching).
[custom.worktree]
when = 'd="$PWD"; while :; do if [ -e "$d/.git" ]; then [ -f "$d/.git" ] && grep -q "/worktrees/" "$d/.git" && exit 0; exit 1; fi; [ "$d" = "/" ] && exit 1; d="${d%/*}"; d="${d:-/}"; done'
shell = ['sh']
style = 'fg:246'
format = '[⊕]($style) '

# Branch: no icon, green. Detached HEAD reports a literal "HEAD" branch;
# suppress it so git_commit's hash shows alone.
[git_branch]
symbol = ''
style = 'fg:76'
format = '[$branch]($style)'
ignore_branches = ['HEAD']

# Detached HEAD: short hash (or tag) where the branch name would be.
[git_commit]
style = 'fg:76'
format = '[$hash$tag]($style)'

# In-progress operation (rebase/merge/cherry-pick…) with step progress.
[git_state]
style = 'fg:178'
format = ' [$state( $progress_current/$progress_total)]($style)'

# Git counters: clean/ahead-behind/stash green (76), staged/modified yellow (178),
# untracked blue (39), conflicts red (196). Leading spaces separate each group.
[git_status]
style = 'fg:76'
format = '[$ahead_behind$stashed$conflicted$staged$modified$untracked]($style)'
ahead = ' [⇡$count](fg:76)'
behind = ' [⇣$count](fg:76)'
diverged = ' [⇣$behind_count⇡$ahead_count](fg:76)'
stashed = ' [*$count](fg:76)'
conflicted = ' [~$count](fg:196)'
staged = ' [+$count](fg:178)'
modified = ' [!$count](fg:178)'
untracked = ' [?$count](fg:39)'

# Exit code: hidden on success, shown in red on failure.
[status]
disabled = false
style = 'fg:160'
symbol = ''
format = ' [$status]($style)'

# Command duration: shown for commands over 3s, grey.
[cmd_duration]
min_time = 3000
style = 'fg:101'
format = ' [$duration]($style)'

# Background jobs: ≡ icon, green (count shown once there are 2+).
[jobs]
style = 'fg:70'
symbol = '≡'
format = ' [$symbol$number]($style)'
symbol_threshold = 1
number_threshold = 2

# Clock: 12-hour, teal-grey.
[time]
disabled = false
style = 'fg:66'
format = ' [$time]($style)'
time_format = '%I:%M %p'

# direnv: only renders in directories with an .envrc.
[direnv]
disabled = false
style = 'fg:178'
format = ' [$symbol$loaded/$allowed]($style)'

# Spark project marker: shown when a spark.yml governs the cwd. Walks up the
# tree like spark-cli's own manifest.FindRoot (built-in detect_files can't
# check parent directories).
[custom.spark]
when = 'd="$PWD"; while :; do [ -f "$d/spark.yml" ] && exit 0; [ "$d" = "/" ] && exit 1; d="${d%/*}"; d="${d:-/}"; done'
shell = ['sh']
symbol = '⚡'
style = 'fg:220'
format = ' [$symbol spark]($style)'
